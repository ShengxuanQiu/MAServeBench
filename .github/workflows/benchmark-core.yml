name: benchmark-core
on: [push, pull_request]
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-repro.txt
      - run: python -m pytest mas_workflow/tests --import-mode=importlib -q
        env:
          PYTHONPATH: mas_workflow:.
          HF_HUB_OFFLINE: "1"
      - run: python -m app.semantic.schema_validation --repo-root .
        env:
          PYTHONPATH: mas_workflow:.
      - run: python -m app.semantic.cli e2e --output outputs/semantic-e2e
        env:
          PYTHONPATH: mas_workflow:.
      - run: bash -n scripts/serve.sh
